<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Location Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        #map { height: 400px; width: 100%; border: 1px solid #ccc; }
        .controls { margin-bottom: 10px; }
        input, button { padding: 8px; margin-right: 5px; }
        #status { font-weight: bold; }
    </style>
</head>
<body>

    <h1>Real-time Location Tracker</h1>

    <div class="controls">
        <input type="text" id="jwt" placeholder="Enter JWT Token" size="50">
        <button id="connectBtn">Connect</button>
        <button id="disconnectBtn" disabled>Disconnect</button>
    </div>
    <p>Status: <span id="status">Disconnected</span></p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const statusEl = document.getElementById('status');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const jwtInput = document.getElementById('jwt');

        let socket;
        let map;
        let marker;
        let locationInterval;

        // Initialize map
        map = L.map('map').setView([51.505, -0.09], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);
        marker = L.marker([51.505, -0.09]).addTo(map);

        connectBtn.addEventListener('click', () => {
            const token = jwtInput.value;
            if (!token) {
                alert('Please enter a JWT token.');
                return;
            }

            socket = io({
                auth: { token }
            });

            socket.on('connect', () => {
                statusEl.textContent = 'Connected';
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                startSendingLocation();
            });

            socket.on('disconnect', () => {
                statusEl.textContent = 'Disconnected';
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                stopSendingLocation();
            });

            socket.on('locationUpdate', (data) => {
                console.log('Received location update:', data);
                const newPos = [data.latitude, data.longitude];
                map.setView(newPos, 15);
                marker.setLatLng(newPos).bindPopup(`User ${data.userId}<br>Updated: ${new Date(data.timestamp).toLocaleTimeString()}`).openPopup();
            });

            socket.on('error', (error) => {
                alert(`Error: ${error}`);
            });
        });

        disconnectBtn.addEventListener('click', () => {
            if (socket) {
                socket.disconnect();
            }
        });

        function startSendingLocation() {
            locationInterval = setInterval(() => {
                // Simulate location change
                const lat = marker.getLatLng().lat + (Math.random() - 0.5) * 0.001;
                const lng = marker.getLatLng().lng + (Math.random() - 0.5) * 0.001;
                
                const location = { latitude: lat, longitude: lng };
                socket.emit('locationUpdate', location);
            }, 5000); // Send update every 5 seconds
        }

        function stopSendingLocation() {
            if (locationInterval) {
                clearInterval(locationInterval);
            }
        }
    </script>

</body>
</html>
